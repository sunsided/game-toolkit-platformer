name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch / PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # game-toolkit links ALSA and D-Bus (audio) and udev (gamepads).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Warnings are errors, missing docs included, matching `task check`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The movement and animation controller without game-toolkit: std only.
      - name: Clippy (no game-toolkit)
        run: cargo clippy -p game-toolkit-platformer --lib --no-default-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Fail on broken intra-doc links before docs.rs ever sees them.
      - name: Docs
        run: cargo doc -p game-toolkit-platformer --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package
        run: cargo publish -p game-toolkit-platformer --dry-run --locked

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      # Keep in sync with `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked

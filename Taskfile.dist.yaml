# https://taskfile.dev
version: '3'

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  run:
    desc: Run the demo (the Cheesed heroine in a moonlit level; PROFILE=debug|release)
    cmds:
      - cargo run -p platformer-demo {{.PROFILE_FLAG}} -- {{.CLI_ARGS}}

  minimal:
    desc: Run the minimal example (a character with the debug look, about 50 lines)
    cmds:
      - cargo run --example minimal {{.PROFILE_FLAG}}

  tilemap:
    desc: Run the tilemap example (a small game on the public API only, its own map at scale 2)
    cmds:
      - cargo run --example tilemap {{.PROFILE_FLAG}}

  screenshot:
    desc: "Save what the window shows after AT seconds (default 2) to OUT, then quit"
    vars:
      OUT: '{{ .OUT | default "screenshots/window.png" }}'
      AT: '{{ .AT | default "2" }}'
    cmds:
      - cargo run -p platformer-demo {{.PROFILE_FLAG}} -- --screenshot {{.OUT}} --at {{.AT}}

  snapshot:
    desc: "Filmstrips of every scripted move, headless, into snapshots/ (or only some: task snapshot -- roll climb)"
    cmds:
      - cargo run -p platformer-demo --release --example snapshot -- snapshots {{.CLI_ARGS}}

  poses:
    desc: "The heroine in every sprite pose, one sheet: snapshots/poses.png (or task poses -- <out.png> [scale])"
    cmds:
      - cargo run -p platformer-demo --release --example poses -- {{ if .CLI_ARGS }}{{.CLI_ARGS}}{{ else }}snapshots/poses.png{{ end }}

  build:
    desc: Build (PROFILE=debug|release)
    cmds:
      - cargo build --workspace {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  test:
    desc: Run tests (movement rules, determinism, animation controller, hero graph)
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  fmt:
    desc: Format sources
    cmds:
      - cargo fmt --all

  lint:
    desc: Clippy (warnings as errors, includes missing docs)
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  check:
    desc: fmt --check, clippy -D warnings and docs without broken links (run before calling it done)
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy -p game-toolkit-platformer --lib --no-default-features -- -D warnings
      - RUSTDOCFLAGS="-D warnings" cargo doc -p game-toolkit-platformer --no-deps
